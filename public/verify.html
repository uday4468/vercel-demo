<!DOCTYPE html>
<html>
<head>
<title>Verify Policy</title>
</head>

<body>

<h2>Policy Verification</h2>

<form action="/api/verify" method="POST">

<input type="hidden" name="id" id="id">

<label>Enter Policy Number</label><br>
<input type="text" name="policy" required><br><br>

<button type="submit">Verify</button>

</form>

<script>

const urlParams = new URLSearchParams(window.location.search)
document.getElementById("id").value = urlParams.get("id")

</script>

</body>
</html>
